# Canonical local configuration for the Yopet database.
#
# This file deliberately has no remote project reference or credentials. Local
# development and CI may safely create a fresh stack from this repository.
project_id = "yopet"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:4196"
additional_redirect_urls = [
  "http://127.0.0.1:4196/*",
  "http://localhost:4196/*",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
