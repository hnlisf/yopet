name: Database CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-lint-and-test:
    name: Rebuild, lint, and test database
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      - name: Start clean local Supabase
        run: supabase start

      - name: Rebuild from tracked migrations and seed data
        run: supabase db reset --local

      - name: Lint database functions
        run: supabase db lint --local --level error --fail-on error

      - name: Run pgTAP schema and RLS tests
        run: supabase test db
